[project]
name = "trt-intent-patch-system"
version = "0.1.0"
description = "Prototype implementation for TRT, Intent Patch, and Audit Bundle"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "jsonpatch>=1.33",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["trt_core", "trt_core.digital_twin_adapter", "scenario_generation"]
