services:
  trt-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: trt-api
    environment:
      # HANDOVER CONFIGURATION: set these two values in the project-root .env
      # when the production vLLM model or endpoint changes. The Python defaults
      # are fallbacks only. Direct n8n model calls are documented separately in
      # docs/start_host_isaac_runner.md and must be kept in sync on re-import.
      VLLM_CHAT_COMPLETIONS_URL: ${VLLM_CHAT_COMPLETIONS_URL:-http://192.168.50.168:26615/v1/chat/completions}
      VLLM_MODEL: ${VLLM_MODEL:-cyankiwi/gemma-4-26B-A4B-it-AWQ-8bit}
      APP_ENV: dev
      M12_AUTOMATED_COMPARISON_TEST: ${M12_AUTOMATED_COMPARISON_TEST:-false}
      ISAAC_EXECUTION_MODE: host_runner
      ISAAC_HOST_RUNNER_URL: ${ISAAC_HOST_RUNNER_URL}
      ISAAC_HOST_HTTP_TIMEOUT_SECONDS: ${ISAAC_HOST_HTTP_TIMEOUT_SECONDS:-10}
      ISAAC_SIMULATION_TIMEOUT_SECONDS: ${ISAAC_SIMULATION_TIMEOUT_SECONDS:-5400}
      ISAAC_STATUS_POLL_INTERVAL_SECONDS: ${ISAAC_STATUS_POLL_INTERVAL_SECONDS:-10}
      ISAAC_STATUS_MAX_POLLS: ${ISAAC_STATUS_MAX_POLLS:-540}
      CONTAINER_PROJECT_ROOT: /app
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT}
    ports:
      - "8000:8000"
    volumes:
      - ./trt_core:/app/trt_core
      - ./scenario_generation:/app/scenario_generation
      - ./schemas:/app/schemas
      - ./data:/app/data
      - ../dt_exchange:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  n8n:
    image: n8nio/n8n:stable
    container_name: n8n
    depends_on:
      trt-api:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      # HANDOVER CONFIGURATION: point N8N_DATA_DIR at the receiving machine's
      # n8n data directory. Do not commit credentials from that directory.
      - "${N8N_DATA_DIR:-C:/Users/$$93I000-7RFCRA0J9IC9/Documents/Docker/n8n_data}:/home/node/.n8n"
      - ./n8n_workflows:/home/node/.n8n/imports:ro
